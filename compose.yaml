name: store-ordering

services:
  app:
    build: .
    image: ${COMPOSE_PROJECT_NAME}-app
    init: true
    cpus: 1.0
    mem_limit: 1536m
    depends_on: &app-dependencies
      db:
        condition: service_healthy
    environment: &app-environment
      APP_NAME: 門市訂單系統
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${STORE_ORDERING_APP_KEY:?請執行 bin/local}
      APP_URL: http://127.0.0.1:${STORE_ORDERING_PORT:?請執行 bin/local}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: ${STORE_ORDERING_DATABASE:?請執行 bin/local}
      DB_USERNAME: store_ordering
      DB_PASSWORD: ${STORE_ORDERING_DB_PASSWORD:?請執行 bin/local}
      SESSION_DRIVER: database
      SESSION_COOKIE: ${STORE_ORDERING_SESSION_COOKIE:?請執行 bin/local}
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      MOCK_PAYMENT_URL: ${MOCK_PAYMENT_URL:-http://mock-payment:8000}
      # 本機 PHP 伺服器以多個程序處理獨立會話，讓 HTTP 可重現交易競爭。
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "127.0.0.1:${STORE_ORDERING_PORT:?請執行 bin/local}:8000"
    healthcheck: &http-healthcheck
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 15

  scheduler:
    # 使用相同映像與資料庫角色執行到期工作，排程器不開放 HTTP 連接埠。
    image: ${COMPOSE_PROJECT_NAME}-app
    init: true
    cpus: 0.25
    mem_limit: 256m
    depends_on: *app-dependencies
    environment: *app-environment
    command: [php, artisan, "schedule:work", "--no-interaction"]

  mock-payment:
    # 僅內部 HTTP 可達；此服務沒有訂單應用的密鑰、資料庫憑證或 session。
    image: ${COMPOSE_PROJECT_NAME}-app
    init: true
    cpus: 0.25
    mem_limit: 256m
    depends_on: *app-dependencies
    environment:
      STORE_ORDERING_SERVICE: mock-payment
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: ${STORE_ORDERING_MOCK_PAYMENT_DATABASE:?請執行 bin/local}
      DB_USERNAME: store_ordering_mock_payment
      DB_PASSWORD: ${STORE_ORDERING_MOCK_PAYMENT_DB_PASSWORD:-}
      LOG_CHANNEL: stderr
      PHP_CLI_SERVER_WORKERS: "2"
    healthcheck: *http-healthcheck

  db:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    cpus: 0.5
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${STORE_ORDERING_DATABASE:?請執行 bin/local}
      POSTGRES_PASSWORD: ${STORE_ORDERING_POSTGRES_PASSWORD:?請執行 bin/local}
      STORE_ORDERING_DB_PASSWORD: ${STORE_ORDERING_DB_PASSWORD:?請執行 bin/local}
      STORE_ORDERING_MOCK_PAYMENT_DATABASE: ${STORE_ORDERING_MOCK_PAYMENT_DATABASE:?請執行 bin/local}
      STORE_ORDERING_MOCK_PAYMENT_DB_PASSWORD: ${STORE_ORDERING_MOCK_PAYMENT_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/init-db.sh:/opt/store-ordering/init-db.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
